[package]
name = "file_obliterator"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
win-ctx = "1.4"
walkdir = "2"

[dependencies.windows]
version = "0.61"
features = [
	"Wdk_Storage_FileSystem",
	"Win32_Storage_FileSystem",
	"Win32_System_IO",
	"Win32_Security",
	"Wdk_System_SystemServices",
	"Win32_System_Threading",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
